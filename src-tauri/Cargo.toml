[package]
name = "roves-packmaster"
version = "0.1.9"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# roves-packmaster lives inside the main Roves engine repo's own directory tree, which has its own
# Cargo workspace (see ../../Cargo.toml) — an empty [workspace] table here tells Cargo this
# crate is its own workspace root instead of trying to join that unrelated one.
[workspace]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "roves_packmaster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Real bundling (see src/bundle.rs): downloads a prebuilt Roves CEF player release asset
# instead of compiling one (no Rust/Python toolchain needed on a game developer's machine)
# and replaces its game -- see the engine repo's AGENTS.md, "Cutting a versioned release"
# section, on why roves-packmaster/roves-action must track a specific release tag.
glob = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "time"] }
futures-util = "0.3"
# 9.x: raw entry copies keep the external attributes (Unix mode incl. setuid, file type), which
# src/cef_player.rs relies on to carry the engine package's executables, the setuid
# chrome-sandbox and any symlink through unchanged on every host; 2.x reduced them to 0o777.
zip = { version = "9", default-features = false, features = ["deflate"] }
walkdir = "2"

# Real installer generation (see src/installer.rs): WiX (Windows), hdiutil (macOS), dpkg-deb
# (Linux) -- each only usable when Packmaster runs on its matching host with that native
# tool already installed, unlike the portable/shell-download path.
uuid = { version = "1", features = ["v4", "v5"] }

# Real Android APK generation (see src/android.rs): a portable JRE (Eclipse Temurin) and the
# Android SDK/NDK ship as .tar.gz on Linux/macOS (the JRE) -- `zip` above already covers the
# SDK/project zips and the NDK's own Linux/Windows .zip.
tar = "0.4"
flate2 = "1"

# Project icon (see src/icon.rs, src/cef_player.rs): `image` decodes/resizes the PNG, validates
# a game's icon.ico/favicon.ico and encodes the Windows .ico (IcoEncoder); `icns` encodes the
# macOS bundle .icns (the iconutil element types), so neither container is hand-written and
# both work on every host.
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
icns = { version = "0.5", default-features = false, features = ["pngio"] }
# Reads the macOS player's Info.plist (CFBundleExecutable, CFBundleIconFile) like roves-action does
# with PlistBuddy, instead of hard-coding the engine's bundle names.
plist = "1"

# Sets play.exe's icon resource in-process on every host (replaces the pinned electron/rcedit
# download, which only ran on Windows); only its resource editing is used, the ICO comes from
# src/icon.rs.
editpe = { version = "0.2.4", default-features = false, features = ["std"] }

# CEF player packages (see src/cef_player.rs): verifies the Windows base against its own
# SHA256SUMS.txt and regenerates it for the output. Already in the lock file through other
# dependencies.
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

