[package]
name = "roves-packmaster"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# roves-ui lives inside the main Roves engine repo's own directory tree, which has its own
# Cargo workspace (see ../../Cargo.toml) — an empty [workspace] table here tells Cargo this
# crate is its own workspace root instead of trying to join that unrelated one.
[workspace]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "roves_packmaster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Real bundling (see src/bundle.rs): downloads a prebuilt Roves shell release instead of
# compiling one (no Rust/Python toolchain needed on a game developer's machine), then packs
# their content into it in-process by linking the engine repo's own content-packer crate as
# a library — see the engine repo's CLAUDE.md, "Cutting a versioned release" section, on why
# roves-ui/roves-action must track a specific shell tag.
roves-content-packer = { git = "https://github.com/DRincs-Productions/roves", tag = "v0.1.0" }
glob = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "io-util"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"

