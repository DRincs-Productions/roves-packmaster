[package]
name = "roves-ui"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# roves-ui lives inside the main Roves engine repo's own directory tree, which has its own
# Cargo workspace (see ../../Cargo.toml) — an empty [workspace] table here tells Cargo this
# crate is its own workspace root instead of trying to join that unrelated one.
[workspace]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "roves_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

