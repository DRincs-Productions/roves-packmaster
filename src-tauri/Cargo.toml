[package]
name = "roves-packmaster"
version = "0.1.8"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# roves-packmaster lives inside the main Roves engine repo's own directory tree, which has its own
# Cargo workspace (see ../../Cargo.toml) — an empty [workspace] table here tells Cargo this
# crate is its own workspace root instead of trying to join that unrelated one.
[workspace]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "roves_packmaster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Real bundling (see src/bundle.rs): downloads a prebuilt Roves shell release instead of
# compiling one (no Rust/Python toolchain needed on a game developer's machine), then packs
# their content into it in-process by linking the engine repo's own content-packer crate as
# a library — see the engine repo's CLAUDE.md, "Cutting a versioned release" section, on why
# roves-packmaster/roves-action must track a specific shell tag.
roves-content-packer = { git = "https://github.com/DRincs-Productions/roves", tag = "v0.1.0" }
glob = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "time"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"

# Real installer generation (see src/installer.rs): WiX (Windows), hdiutil (macOS), dpkg-deb
# (Linux) -- each only usable when Packmaster runs on its matching host with that native
# tool already installed, unlike the portable/shell-download path.
uuid = { version = "1", features = ["v4", "v5"] }

# Real Android APK generation (see src/android.rs): a portable JRE (Eclipse Temurin) and the
# Android SDK/NDK ship as .tar.gz on Linux/macOS (the JRE) -- `zip` above already covers the
# SDK/project zips and the NDK's own Linux/Windows .zip.
tar = "0.4"
flate2 = "1"

# Single-icon-in, everywhere-out icon generation (see src/icon.rs): derives the Windows .ico
# and macOS .icns the platform-native packaging steps need from the one PNG a game developer
# picks, instead of asking them to supply pre-made .ico/.icns files themselves. PNG-decode
# and resize only -- both .ico/.icns containers are hand-written (see that module), storing
# plain PNG-encoded frames directly (a well-supported convention on both formats since
# Windows Vista / macOS 10.7), so no `ico`/`icns`-writing crate is needed either.
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"

